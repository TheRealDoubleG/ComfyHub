name: Build Comfy Suite Package

on:
  push:
    paths:
      - ".github/workflows/build-comfy-suite.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Collect latest Comfy Suite addons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          repos=(
            ComfyHub
            ComfyBar
            ComfyCC
            ComfyMacro
            ComfyOnPoint
            ComfyEnemyBar
            ComfyPanel
            ComfyBag
            ComfyMog
            ComfyXP
            ComfyProfiles
            ComfyKey
          )
          for repo in "${repos[@]}"; do
            git clone --depth 1 "https://github.com/TheRealDoubleG/${repo}.git" "package/${repo}"
            rm -rf "package/${repo}/.git" "package/${repo}/.github"
          done

      - name: Upload ready-to-extract AddOns package
        uses: actions/upload-artifact@v4
        with:
          name: ComfySuite-WoW-Forever
          path: package/*
          include-hidden-files: false
          retention-days: 1
